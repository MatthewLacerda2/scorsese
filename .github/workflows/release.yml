name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: scorsese-linux-x86_64
            binary: scorsese
          - os: macos-latest
            artifact: scorsese-macos-arm64
            binary: scorsese
          - os: windows-latest
            artifact: scorsese-windows-x86_64.exe
            binary: scorsese.exe
    steps:
      - uses: actions/checkout@v7

      # Saved by `main` only, as in ci.yml (#1130): a tag's own copy would be
      # read by nothing but that tag, and the repository has 10 GB for all of it.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release -p scorsese-cli

      - name: Stage artifact
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}" --clobber

  # Releases ship the headless CLI binary only. The desktop app (`app/`, egui,
  # its own cargo workspace) is not released yet: whether to package it, and
  # with ffmpeg bundled beside the binary or not, is the maintainer's call.
