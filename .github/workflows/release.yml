name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: scorsese-linux-x86_64
            binary: scorsese
          - os: macos-latest
            artifact: scorsese-macos-arm64
            binary: scorsese
          - os: windows-latest
            artifact: scorsese-windows-x86_64.exe
            binary: scorsese.exe
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p scorsese-cli

      - name: Stage artifact
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}" --clobber

  # TODO: Tauri bundling (GUI app + ffmpeg sidecar) is not wired yet — it
  # arrives with the "Tauri GUI shell + timeline view" seed issue. Until
  # then releases ship the headless CLI binary only.
