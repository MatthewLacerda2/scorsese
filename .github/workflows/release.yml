name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build CLI and MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on CI's own pinned image, so what a tag ships was built
        # where `main` is tested. CI has no macOS or Windows job: those two
        # binaries are built here and nowhere else.
        include:
          - os: ubuntu-24.04
            suffix: linux-x86_64
            exe: ""
          - os: macos-latest
            suffix: macos-arm64
            exe: ""
          - os: windows-latest
            suffix: windows-x86_64
            exe: .exe
    steps:
      - uses: actions/checkout@v7

      # Saved by `main` only, as in ci.yml (#1130): a tag's own copy would be
      # read by nothing but that tag, and the repository has 10 GB for all of it.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--locked`, as in CI: a release builds the `Cargo.lock` `main` was
      # tested with, never a fresh resolution of it.
      - name: Build
        run: cargo build --release --locked -p scorsese-cli -p scorsese-mcp

      - name: Stage artifacts
        shell: bash
        run: |
          for bin in scorsese scorsese-mcp; do
            cp "target/release/$bin${{ matrix.exe }}" "$bin-${{ matrix.suffix }}${{ matrix.exe }}"
          done

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "scorsese-${{ matrix.suffix }}${{ matrix.exe }}" \
            "scorsese-mcp-${{ matrix.suffix }}${{ matrix.exe }}" --clobber

  # Releases ship the headless binaries only: the CLI and the MCP server. The
  # desktop app (`app/`, egui, its own cargo workspace) is not released yet:
  # whether to package it, and with ffmpeg bundled beside the binary or not, is
  # the maintainer's call.
