name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked` everywhere below: a Cargo.lock that would need updating
      # fails loudly here instead of being quietly rewritten inside the runner,
      # so CI builds exactly the dependency versions the PR author built.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The golden renders live inside `cargo test --workspace`, so a failure
      # above may be a pixel regression. These are the frames it disagreed with,
      # uploaded so the diff can be looked at rather than guessed at.
      - name: Upload golden-render failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/tmp/golden-failures/
          if-no-files-found: ignore

  # Supply chain. Nothing else in this workflow looks at what our ~60
  # transitive dependencies are or what they are licensed under; a RUSTSEC
  # advisory would otherwise land silently and stay until someone happened to
  # read a changelog. This is a blocking gate, not a signal — a known
  # vulnerability is not something to report and merge anyway. The policy,
  # including any deliberately ignored advisory and its reasoning, lives in
  # `deny.toml`; override there, never by relaxing this step.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses
