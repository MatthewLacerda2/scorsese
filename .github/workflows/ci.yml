name: CI

# Markdown-only changes skip CI — with one exception, and it is the whole
# point of the exception. `docs/project-format.md` is read by tests: its JSON
# examples are parsed and its animatable-property table is compared to the
# code. Skipping CI for it would mean the one document under test is the one
# document that can be broken without anything noticing. Patterns are ordered:
# a later one overrides an earlier one for a path both match.
#
# CI speaks in two situations and no others: a pull request **claims to be
# finished**, and `main` moves. Every job below carries `if: ${{ !DRAFT }}` —
# spelled out each time, because Actions has no workflow-level `if`.
#
# The invariant it rests on: **a ready pull request claims it passes; a draft
# makes no such claim.** CI's job is to check claims, so a red run always means
# a claim was broken, which is worth an email every time. A draft is how work
# survives a question needing the user, a failure the agent could not resolve,
# or a session that died mid-task — none of those asserts anything, so there is
# nothing to check. Silence on drafts is not leniency about unfinished work; it
# is having nothing asserted to it.
#
# The evidence: of the eight CI failures on record, **seven fired while the
# pull request was still a draft**, and not one has ever occurred on `main`.
# That is a notification channel being trained to be ignored, and the cost is
# not the noise — it is that `main` going red would be deleted unread too.
#
# `ready_for_review` in `types:` is load-bearing, and omitting it fails *open*.
# It is not one of the defaults (`opened`, `synchronize`, `reopened`), so the
# draft condition without it would mean a pull request drafted, finished, and
# marked ready with no further push never gets a run at all — merging with no
# checks rather than with green ones. Both halves are needed together.
#
# The other half of this lives in CLAUDE.md: the gates run locally before a
# pull request is marked ready, so `make gates` rather than GitHub is the first
# thing to compile the code. Deliberately not before every push — checkpoint
# commits stay cheap, which is what break-testing depends on.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "docs/project-format.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!**.md"
      - "docs/project-format.md"

# `ubuntu-24.04` and not `ubuntu-latest`, everywhere below, and the reason is
# ffmpeg. It comes from the image's apt archive — 6.1.1-3ubuntu5 there — and
# ffmpeg is not only the encoder at the end of a render; it is the **decoder**
# at the start of one, so every pixel the golden gate compares arrived through
# it. `ubuntu-latest` is a moving label: when GitHub rolls it to the next LTS,
# the decoder under the pixel gate changes major version with nothing in any
# diff to say so. `rust-toolchain.toml` pins the compiler for exactly this
# reason, and its comment is the whole argument — a gate that goes red for a
# cause its author cannot see teaches people that red means "try again".
#
# Pinned at the image rather than at the package version. `apt-get install
# ffmpeg=7:6.1.1-3ubuntu5` would pin harder and break the day the archive
# rotates that build out, which would be this same failure arriving by the
# other door.
#
# What this states, so a developer can match it: the golden references are held
# to account under **ffmpeg 6.1.1** from Ubuntu 24.04. Measured against 8.1.2
# on Arch, both decode these fixtures to bit-identical frames — see
# docs/golden-renders.md.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      # Printed, not only installed. A run that compares pixels should say in
      # its own log which decoder produced them, so a future disagreement can
      # be dated rather than reconstructed.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # A prebuilt binary, not a build. `cargo install cargo-nextest` compiles a
      # large tool from source in every job, which would cost more than the
      # faster suite saves — the same reason `coverage` and `mutants` below get
      # their tools from this action rather than from cargo.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check

      # `--locked` everywhere below: a Cargo.lock that would need updating
      # fails loudly here instead of being quietly rewritten inside the runner,
      # so CI builds exactly the dependency versions the PR author built.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The API docs, built as a gate. `-D warnings` turns a broken or
      # ambiguous intra-doc link into a failure — one had been dangling in
      # `scorsese-golden` for months simply because nothing ever ran this, and
      # CLAUDE.md names each crate's `lib.rs` doc as the statement of that
      # crate's boundary. A doc nobody builds is a doc that rots.
      #
      # A step of this job rather than a job of its own: rustdoc needs the
      # workspace compiled, and this way it reuses the cache the build above
      # already warmed instead of paying for a second one.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # `docs/project-format.md` is gated from inside the test run: its JSON
      # examples are parsed as projects and its animatable-property table is
      # held to what the code publishes. Nothing extra to invoke here.
      #
      # nextest rather than `cargo test`: 31 integration test binaries, which
      # cargo runs essentially one at a time while threading only within each.
      # nextest schedules every test from every binary in one pool and runs each
      # in its own process, so a crash costs one result instead of a binary's
      # worth. Measured warm on the dev machine, 44.5s to 34.0s — see #225.
      - name: Test
        run: cargo nextest run --workspace --locked

      # Its own step because nextest cannot run doctests — an upstream
      # limitation, not a nextest decision. There are zero compiled doctests in
      # the tree today (every code fence is ```text or ```jsonc), so this costs
      # about a second; it is here so the first real one does not silently go
      # unrun.
      - name: Doctests
        run: cargo test --doc --workspace --locked

      # A signal, in the job that has already built the binary: what a generated
      # shot costs, and how long ago somebody read those figures off the
      # vendor's page. `scorsese prices` prints Markdown for exactly this
      # reason, so nothing stands between the table and the summary — no
      # renderer to disagree with the terminal.
      #
      # `|| true` is the gates-vs-signals rule made literal. A price checked
      # eight months ago is worth a line here and is not worth blocking a
      # merge: the number being old does not make it wrong.
      - name: Prices (signal)
        if: always()
        run: |
          { echo "## Provider prices"; echo; \
            cargo run --quiet --locked --bin scorsese -- prices; \
          } >> "$GITHUB_STEP_SUMMARY" || true

      # The golden renders live inside the test step above, so a failure there
      # may be a pixel regression. These are the frames it disagreed with,
      # uploaded so the diff can be looked at rather than guessed at.
      #
      # The path survives the runner change, and it was checked rather than
      # assumed: the harness writes into `CARGO_TARGET_TMPDIR`, which cargo
      # bakes in at *compile* time as `<target-dir>/tmp`, so which process runs
      # the test afterwards cannot move it.
      - name: Upload golden-render failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/tmp/golden-failures/
          if-no-files-found: ignore

  # The size gate: source files ≤ 300 lines of code, test files ≤ 150 — blank
  # and comment lines do not count, for the reasons in `scan::code_lines`.
  # CLAUDE.md lists
  # it among the hard gates and, until now, nothing checked it — a limit that
  # held by habit for as long as someone was watching. Its own job because it
  # needs neither ffmpeg nor a build of the workspace, so it answers in seconds
  # instead of waiting behind the heavy one. The rule deciding which cap a path
  # falls under lives in `tools/lint/src/classify.rs`, and its tests run here
  # first: a classifier that quietly misfiles a path is a gate that has stopped
  # gating without saying so.
  app:
    name: desktop app
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      # egui reaches a window through the platform's own graphics and windowing
      # libraries, which a bare runner does not have. Nothing here opens a
      # window, but the app still links against them — and the panel snapshots
      # rasterise through wgpu, which needs an adapter to exist at all.
      # `mesa-vulkan-drivers` provides lavapipe, a software one, so a runner
      # with no GPU can still draw the window offscreen.
      #
      # ffmpeg because the preview composites a real frame through
      # `scorsese-render`, which is the whole point of it — a preview that drew
      # the picture its own way would be a preview that lies. Without ffmpeg the
      # panel says so, clearly and with the fix, and a snapshot of *that* is a
      # snapshot of a runner misconfiguration rather than of the window.
      # `libasound2-dev` is a *build* requirement, not a runtime one: `cpal`
      # goes through `alsa-sys`, whose build script asks pkg-config for
      # `alsa.pc` and fails the compile without it. A runner has no sound card
      # and does not need one — the preview falls back to the wall clock and
      # plays the picture silently — but it does need the headers to link.
      - name: Install the graphics, windowing and sound libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers libvulkan1 \
            libasound2-dev \
            ffmpeg

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # The same runner as `check`, installed the same way. One workspace on
      # nextest and the other on `cargo test` would mean "the tests" describing
      # two different things in one repo.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Its own job, and its own workspace: a graphics dependency tree must
      # never be on the path of a headless change, and a broken app build must
      # never block one.
      - name: Format
        run: cargo fmt --manifest-path app/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --manifest-path app/Cargo.toml --locked

      # A gate, not a signal: a failing app test blocks a merge exactly as a
      # failing workspace test does. `app/` is its own workspace so that a
      # graphics dependency tree never slows a headless change — which means
      # `cargo test --workspace` cannot reach these, and this job is the only
      # place they ever run.
      #
      # Nothing here opens a window. The tests are the logic behind the
      # drawing — the frame-to-pixel transform, snapping, trim arithmetic,
      # what a refused edit leaves on disk — which is where the bugs are.
      - name: Test
        run: cargo nextest run --manifest-path app/Cargo.toml --locked

      - name: Doctests
        run: cargo test --doc --manifest-path app/Cargo.toml --locked

  size:
    name: size gate
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/lint

      - name: Test the gate
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

      - name: Run the gate
        run: cargo run --manifest-path tools/lint/Cargo.toml --locked --quiet

      - name: Format
        run: cargo fmt --manifest-path tools/lint/Cargo.toml --all --check

      - name: Clippy
        run: >
          cargo clippy --manifest-path tools/lint/Cargo.toml
          --all-targets --locked -- -D warnings

  # The renderers for the two signals below. They are Python, so nothing else in
  # this workflow compiles or checks them, and they had a bug that made both
  # signals look broken: on a branch whose only Rust changes are test files,
  # cargo-mutants finds nothing to mutate and writes no report, and reading that
  # as a missing file made `make mutants` exit on a traceback and made this
  # workflow announce that the run had failed to produce a report. Neither was
  # true — there was simply nothing in scope.
  #
  # A gate rather than a signal, by CLAUDE.md's rule: what it checks is ordinary
  # correctness, not a quality audit. Its own job because it needs no Rust
  # toolchain, no ffmpeg and no cache — stdlib `unittest`, and it answers in
  # seconds beside everything else.
  scripts:
    name: signal renderers
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover --start-directory .github/scripts/tests --verbose

  # Coverage. A signal, never a gate — the one job here that cannot turn
  # anything red, by design.
  #
  # What it exists to catch: nothing else tells you a `pub fn` has no test at
  # all. `clippy -D warnings` promotes rustc's `dead_code`, which catches
  # private rot, but `dead_code` never fires on `pub` items in a library crate
  # — and nearly everything in these crates is `pub`, because they exist to be
  # called by the CLI, the MCP server and the GUI. Break-testing #31 found two
  # behaviours with no coverage whatsoever and the suite stayed green.
  #
  # Why it never blocks: CLAUDE.md's gates-vs-signals rule. A check that proves
  # correctness gates; a check that audits quality informs. A percentage
  # threshold would be actively harmful here — it rewards tests that execute
  # lines over tests that assert behaviour, which is the opposite of what this
  # repo's tests are for. The audio tests measure loudness over a window and
  # the golden tests compare pixels; neither moves a coverage number much, and
  # both are worth more than anything a threshold would buy. If a number should
  # ever gate something, that is a decision made on purpose in its own PR.
  #
  # `continue-on-error` is what makes that structural rather than a promise: a
  # failure in this job — a broken flag, a runner without ffmpeg, llvm-cov
  # itself falling over — leaves the workflow run green. The job's own check
  # still goes red, which is the right place for "your signal is broken" to
  # show up, and the PR stays mergeable. The one way to undo that is to name
  # this job in a branch-protection required-checks list: don't. That would
  # make it a gate by the back door, which is the decision this issue
  # deliberately did not make.
  #
  # On pull requests *and* pushes to main. The PR run is where an agent acts on
  # it; the main run is the baseline that number is read against, and main is
  # exactly where an unattended overnight merge would otherwise go unmeasured.
  # It costs runner minutes but not latency: it runs beside `check` rather than
  # behind it, and it can never be the job someone is waiting on.
  #
  # What is excluded, and why:
  #
  # - `crates/golden` — test infrastructure; nothing ships it and nothing
  #   depends on it. Measuring how well the harness is tested measures the
  #   wrong thing, and it would flatter the average besides. `--exclude-from-
  #   report` and not `--exclude`: its tests still *run*, because rendering
  #   fixtures is a large part of what exercises `render` and `compositor`.
  #   The coverage it produces in other crates is exactly what we want counted.
  # - `tools/lint` — its own workspace, deliberately outside
  #   `cargo test --workspace` so the size gate is runnable without ffmpeg. In
  #   for free it is not: it would need a second instrumented build and a
  #   merged profile, doubling this job for a four-file tool whose own tests
  #   already run as a hard gate in `size` above. Out, on cost.
  # - Integration tests themselves (`crates/*/tests/**`) — llvm-cov omits test
  #   targets from the report by default, which is right: a test file is 100%
  #   covered by definition and counting it would only dilute the number.
  coverage:
    name: coverage (signal)
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # The same tests as `check`, so the same decoder. This job is roughly as
      # long as that one for the same reason.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Its own cache key: instrumented builds carry different RUSTFLAGS and
      # would otherwise thrash the artifacts `check` depends on.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `rust-toolchain.toml` pins rustfmt and clippy only. llvm-tools is asked
      # for here rather than added there so the pin stays the set every job
      # needs, and only this one pays to download it.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Measure
        run: >
          cargo llvm-cov --workspace --locked
          --exclude-from-report scorsese-golden
          --json --output-path coverage.json

      # Read where it lands, not behind a click. llvm-cov's own report is a
      # twelve-column table with a row per file; this is the same data ordered
      # by what someone would act on.
      - name: Render the report
        run: |
          python3 .github/scripts/coverage-summary.py coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # One comment that rewrites itself, keyed on the marker below — a signal
      # that grows a new comment per push stops being read by the third one.
      # Skipped for forks, whose token has no write scope; nothing downstream
      # depends on it, and the job cannot fail the run either way.
      - name: Comment on the PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '<!-- coverage-signal -->'; cat coverage.md; } > comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq 'map(select(.body | startswith("<!-- coverage-signal -->")))
                  | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  # Mutation testing. The second signal, and the same rules as `coverage`
  # above: it reports, it never blocks.
  #
  # What it exists to catch, and why coverage does not catch it: coverage
  # answers "was this line executed?", mutation answers "if this line were
  # wrong, would anything notice?". A line can be executed by ten tests and
  # asserted on by none. That is not hypothetical here — break-testing #8 found
  # a volume-ramp test that passed with volume ignored entirely, because it
  # asserted only that three measured levels ascended, which a clip at constant
  # level satisfies by chance about half the time. Replacing `Gain::at`'s body
  # with a constant is exactly the mutation that survives such a test.
  #
  # What it does *not* replace is break-testing. Of the three real coverage
  # gaps found in this project so far, mutation would have caught one. The
  # other two were semantic — a music bed restarting at every cut instead of
  # resuming, keyframes timed from the timeline instead of from the clip — and
  # in both the line ran, an assertion reached it, and no generated mutant
  # would have survived. No tool mutates "resumed from the wrong offset" into
  # existence. Mutation asks whether anything asserts this at all;
  # break-testing asks whether the assertion pins down the right behaviour.
  #
  # Scoped two ways, because a naive sweep of this workspace would take hours:
  # to the pure-logic surface (the crates and modules with no ffmpeg in them),
  # and to the lines this PR changed. `.cargo/mutants.toml` holds the first,
  # with the reasoning for every inclusion and exclusion, plus the
  # equivalent-mutant policy; `--in-diff` below is the second, and it is what
  # makes the cost track the size of the change rather than the size of the
  # codebase. The full scoped surface is 3018 mutants at cargo-mutants 27.1.0;
  # a per-PR run sees a small fraction of that. This line read "592 mutants,
  # ~12 minutes at `-j 3`" until #289, and both halves of that drifted for
  # reasons worth separating: the surface grew when `crates/zimmer` was added
  # to it, and the count grew *again* on the same source because a newer
  # cargo-mutants generates mutations the older one did not. Hence the version
  # stamp — a count here is only ever a count for one tool version.
  #
  # Pull requests only. `--in-diff` needs two commits to compare, and a push to
  # `main` has no base to be a diff *from*. If a full sweep is ever wanted, it
  # belongs on a schedule with its own job, not bolted onto this one.
  #
  # Ready ones only, by the rule at the top of this file. This signal exists for
  # an agent to act on before claiming the work is finished, so a draft is a
  # branch with nothing claimed about it yet — and the survivor list it would
  # comment is one an in-progress branch has not finished earning.
  mutants:
    name: mutants (signal)
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    # The same structural guarantee `coverage` relies on: whatever happens in
    # here — survivors, a broken flag, cargo-mutants itself falling over — the
    # workflow run stays green and the PR stays mergeable. The job's own check
    # can still go red, which is where "your signal is broken" belongs. Naming
    # this job in a branch-protection required-checks list would undo all of
    # that: don't.
    continue-on-error: true
    # A backstop under the per-mutant timeout in `.cargo/mutants.toml`. That
    # one catches a single mutant that hangs; this one catches a diff so large
    # that the run stops being a per-PR signal, and ends it rather than letting
    # it wander towards the six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # `fetch-depth: 0`, and this is load-bearing. `--in-diff` compares
      # against the base commit, and the default shallow checkout does not
      # contain it — the diff would come out empty and the job would cheerfully
      # report "no mutants" on every PR forever. A signal that is silently
      # measuring nothing is worse than no signal, so the step below refuses to
      # continue rather than assume.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mutants in `crates/render/src/plan/` and `src/audio/` run that crate's
      # tests, which decode real fixture media.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      # The first thing measured, and before anything is scoped to this pull
      # request: is there a surface left to mutate at all? #363 and #365 were
      # `exclude_re` entries written as the line `--list` prints when the field
      # holds regular expressions -- `||` is an alternation with an empty
      # branch, an empty branch matches every mutant there is, and the surface
      # went to six. This job passed anyway for ten merged pull requests,
      # because "nothing to report" is also what a healthy diff says.
      #
      # `--list` builds nothing and runs nothing, so this costs a second and
      # runs whether or not the diff below turns out to hold any Rust: what it
      # checks is the instrument, not the change. Red here means the signal is
      # broken, which is the one thing this job is allowed to go red for.
      - name: The surface is still there
        run: |
          cargo mutants --list > mutants-list.txt
          python3 .github/scripts/mutation-surface.py mutants-list.txt

      # Every failure here is fatal on purpose. The one thing this job must
      # never do is compare against nothing and call the silence good news, so
      # a base that cannot be resolved, or a diff that comes out empty when a
      # pull request by definition changed something, stops the job instead of
      # producing a clean report. The base and the file count go into the
      # report too, so a reader can see what was compared rather than assume.
      - name: The lines this PR changed
        id: diff
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          if ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            echo "::error::$BASE is not in this checkout; --in-diff would" \
                 "silently mutate nothing"
            exit 1
          fi
          merge_base=$(git merge-base "$BASE" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "::error::the diff against $merge_base is empty, which cannot" \
                 "be true of a pull request; the base ref is wrong"
            exit 1
          fi
          git diff "$merge_base" HEAD -- '*.rs' > pr.diff
          rust=$(git diff --name-only "$merge_base" HEAD -- '*.rs' | wc -l)
          echo "Diff-scoped to this pull request: $rust of $changed changed" \
               "files are Rust, against \`$BASE\` (merge base" \
               "\`$(git rev-parse --short "$merge_base")\`)." > scope.txt
          if [ -s pr.diff ]; then echo "rust=yes" >> "$GITHUB_OUTPUT"
          else echo "rust=no" >> "$GITHUB_OUTPUT"; fi

      # There is deliberately no warm-up build here, and this is the note that
      # stops one being added back. cargo-mutants builds every mutant in a copy
      # of the tree, and that copy has no `target/` in it: `copy_target` has
      # defaulted to false since it was reintroduced in 25.1.0, and 1.0.2
      # stopped copying `target/` at all on the grounds that cargo-mutants sets
      # its own `RUSTFLAGS` and would not match those build products anyway. So
      # a `cargo build` in this step compiles into a directory no mutant build
      # ever reads. The one thing that does reach a mutant is the crate
      # downloads in `~/.cargo`, and the cache above carries those — for free,
      # and the mutation run below populates them itself when it does not.
      #
      # This job used to carry `cargo build --workspace --tests --locked` here,
      # and #394 measured it on the runner rather than arguing about it: this
      # job body with and without the step, six pairs, each pair side by side
      # on one commit over the same fixed ten-mutant workload. The mutation
      # step averaged **150s warmed against 147s cold** — the warmed side
      # fractionally slower, which is what no effect looks like against a
      # spread of about 17s — and cargo-mutants' own baseline build inside the
      # scratch copy came in at 33-45s on both sides, its spread following the
      # runner rather than the warming. The step itself cost 73-178s. Whole
      # job: **368s warmed, 203s cold.**
      #
      # The seventeen real runs before that agree about the bill. It averaged
      # 153s there and was 60% of the job's wall clock, and in thirteen of them
      # the mutation step that followed it finished in under a second, because
      # the diff's Rust was all test files and there was nothing to mutate.

      # Never fails on its own: surviving mutants are an ordinary result, not
      # an error, and the exit code that says so must not be confused with the
      # one that says the tool broke. cargo-mutants distinguishes them — 2 is
      # "found survivors", 3 is "something timed out", and the guard at the end
      # of this job turns anything else red.
      #
      # `--jobs 2` because the config file has nowhere to hold it: the argument
      # for the number, and for it being the same one `make mutants` and the
      # sweep pass, is in `.cargo/mutants.toml` under "How wide a run fans out".
      - name: Mutate
        if: steps.diff.outputs.rust == 'yes'
        run: |
          cargo mutants --in-diff pr.diff --jobs 2 --colors never && status=0 || status=$?
          echo "MUTANTS_STATUS=$status" >> "$GITHUB_ENV"

      - name: Render the report
        if: always()
        run: |
          scope=$(cat scope.txt 2>/dev/null || echo "Scope unknown.")
          # One path, and deliberately: the summary script renders a run that
          # had nothing to do as readily as one that did, so a missing
          # `outcomes.json` is no longer read here as breakage. It is the
          # ordinary result for a pull request whose Rust changes are all test
          # files — which used to land in the `else` below and report "the run
          # did not produce a report", saying the tool broke when it had not.
          python3 .github/scripts/mutants-summary.py mutants.out/outcomes.json "$scope" \
            > mutants.md
          tee -a "$GITHUB_STEP_SUMMARY" < mutants.md

      # One comment that rewrites itself, keyed on the marker — the same shape
      # as `coverage` above, so the two signals read as one system. It is
      # written when there is something to say and *rewritten* when there is
      # not, which is how a survivor list clears itself once a re-push fixes
      # it; what it never does is open a fresh comment on a PR that has nothing
      # to report. Skipped for forks, whose token has no write scope.
      - name: Comment on the PR
        if: >
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '<!-- mutation-signal -->'; cat mutants.md; } > comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq 'map(select(.body | startswith("<!-- mutation-signal -->")))
                  | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          elif grep -qE '^### (.* survived|Timed out)' mutants.md; then
            gh pr comment "$PR" --body-file comment.md
          else
            echo "nothing to report and no comment to clear"
          fi

      # The only thing in this job that can go red, and it is reserved for the
      # signal being broken rather than the code being unasserted.
      - name: Fail only if the tool itself broke
        if: always() && steps.diff.outputs.rust == 'yes'
        run: |
          case "$MUTANTS_STATUS" in
            0|2|3) echo "cargo-mutants ran (exit $MUTANTS_STATUS)" ;;
            *) echo "::error::cargo-mutants exited $MUTANTS_STATUS"; exit 1 ;;
          esac

  # Supply chain. Nothing else in this workflow looks at what our transitive
  # dependencies are or what they are licensed under; a RUSTSEC advisory would
  # otherwise land silently and stay until someone happened to read a
  # changelog. This is a blocking gate, not a signal — a known vulnerability is
  # not something to report and merge anyway. The policy, including any
  # deliberately ignored advisory and its reasoning, lives in `deny.toml`;
  # override there, never by relaxing this step.
  #
  # TWO steps, because there are two lockfiles. `app/` is its own cargo
  # workspace, so the root run sees none of it — that is how 385 crates,
  # `eframe`, `egui`, `wgpu` and `winit` among them, sat outside this gate
  # while it looked like it covered the project. Both steps read the same
  # `deny.toml`: one policy, checked twice.
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    # Drafts assert nothing, so there is nothing to check. See the top of
    # this file; `ready_for_review` in `types:` is what makes it fire at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: The workspace
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

      # `--all-features` is repeated rather than inherited: `arguments`
      # *replaces* the action's default of `--all-features`, so omitting it
      # here would check the app with default features only and let a
      # feature-gated dependency through the gate that exists to catch it.
      - name: The desktop app
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/Cargo.toml
          arguments: --all-features --config deny.toml
          command: check advisories bans sources licenses
