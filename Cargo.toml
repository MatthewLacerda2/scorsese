[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/zimmer",
    "crates/compositor",
    "crates/render",
    "crates/providers",
    "crates/cli",
    "crates/mcp",
    "crates/golden",
    # A tool rather than a crate that ships, and a member all the same: being
    # one is what puts it under the same fmt, clippy and doc gates as the code
    # it maintains, with nothing added to the Makefile or to CI. Nothing
    # depends on it and no build runs it — it converts the vendored icon tree
    # into the blob the compositor compiles in, by hand, when that tree moves.
    "tools/icons",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/MatthewLacerda2/scorsese"
# scorsese ships as an application, not as crates: nothing here goes to a
# registry. Saying so keeps `cargo publish` from ever firing by accident, and
# lets the license gate in `deny.toml` skip our own crates while still holding
# every dependency to the allow-list.
publish = false

# Every lint here is a merge gate: CI runs `cargo clippy -D warnings`, so a
# warning fails the build. The set is deliberately small — each entry states an
# invariant the codebase already holds, not a style preference. See CLAUDE.md's
# "Repo-specific conventions" for the policy.
[workspace.lints.rust]
# There is no `unsafe` in this workspace. `forbid` makes that a guarantee
# rather than a coincidence — it cannot be un-done by a local `allow`.
unsafe_code = "forbid"
# CLAUDE.md points at each crate's `lib.rs` module doc as the statement of its
# boundary. The docs are architecture, so an undocumented public item is a hole
# in the architecture.
missing_docs = "warn"
# `pub` on an item no other crate can reach is API surface nobody meant to add.
unreachable_pub = "warn"

[workspace.lints.clippy]
# Library code states its invariants with `expect("...")`. `unwrap` in a test is
# the assertion itself, so test targets allow it back — see the crate roots.
unwrap_used = "deny"
# Debugging leftovers must not survive a merge.
dbg_macro = "deny"
todo = "deny"

# The ordinary build has to be fast enough to render with, because rendering is
# what this program does and nobody should have to know a second command to do
# it. At `opt-level = 0` a ten-second 1080p render took **1290 seconds**; at
# `1` it takes **36**. That is not a slow compositor, it is an unoptimised one,
# and measuring the unoptimised build was how "rendering is slow" became folklore.
#
# `1` rather than `2` or `3`, measured rather than assumed:
#
#   dev profile     rebuild   test --workspace   10s of 1080p
#   opt-level 0        2s           43s            1290s
#   opt-level 1        8s           39s              36s
#   opt-level 2       42s           93s              34s
#
# Level 2 buys two seconds of render and costs five times the rebuild and more
# than twice the test suite. Level 1 costs six seconds a rebuild and makes
# `cargo test` *faster*, because the golden renders speed up by more than the
# extra compiling costs.
#
# `debug_assertions` stays on — this is the dev profile, not a release one — so
# a fast render is still a checked one. That was the point of raising this
# profile rather than telling everyone to pass `--release`.
[profile.dev]
opt-level = 1

# Dependencies get the full treatment. They are compiled once and then cached,
# so their optimisation costs nothing per edit — and tiny-skia, which does the
# actual rasterising, is one of them.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
scorsese-core = { path = "crates/core" }
scorsese-zimmer = { path = "crates/zimmer" }
scorsese-compositor = { path = "crates/compositor" }
scorsese-render = { path = "crates/render" }
scorsese-providers = { path = "crates/providers" }
