[package]
name = "scorsese-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "scorsese-server"
path = "src/main.rs"

[dependencies]
base64.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
scorsese-core = { version = "0.1.0", path = "../core" }
scorsese-mcp = { version = "0.1.0", path = "../mcp" }
scorsese-providers = { version = "0.1.0", path = "../providers" }
scorsese-render = { version = "0.1.0", path = "../render" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tower-http = { version = "0.7.1", default-features = false, features = ["trace"] }

[dev-dependencies]
# `scorsese_render::testing`: the tiny media files the tests make.
scorsese-render = { version = "0.1.0", path = "../render", features = ["test-support"] }
tokio = { version = "1.53.1", features = ["io-util"] }
