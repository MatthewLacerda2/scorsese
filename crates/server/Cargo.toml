[package]
name = "scorsese-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "scorsese-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
scorsese-providers = { version = "0.1.0", path = "../providers" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util"] }
