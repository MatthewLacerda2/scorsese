<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; font-family: Inter; color: white; }
  #dot { position: absolute; left: 100px; top: 200px; width: 240px; height: 240px; border-radius: 50%; background: #06d6a0; }
  #ticks { position: absolute; left: 100px; top: 640px; font-size: 220px; font-weight: 800; }
</style>
<div id="dot"></div>
<div id="ticks">0</div>
<script>
  const start = performance.now();
  requestAnimationFrame(function step(now) {
    dot.style.transform = `translateX(${(now - start) * 1.4}px)`;
    requestAnimationFrame(step);
  });
  let n = 0;
  setInterval(() => (ticks.textContent = ++n), 100);
</script>
