[package]
name = "scorsese-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "scorsese"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
scorsese-core = { version = "0.1.0", path = "../core" }
scorsese-guide = { version = "0.1.0", path = "../guide" }
scorsese-providers = { version = "0.1.0", path = "../providers" }
scorsese-render = { version = "0.1.0", path = "../render" }

[dev-dependencies]
# `StubProbe`, for the measuring tests that never run ffprobe (#1279).
scorsese-core = { version = "0.1.0", path = "../core", features = ["test-support"] }
# `scorsese_render::testing`: the tiny media files the tests make.
scorsese-render = { version = "0.1.0", path = "../render", features = ["test-support"] }
serde_json = "1.0.151"
