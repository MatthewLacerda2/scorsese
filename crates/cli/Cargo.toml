[package]
name = "scorsese-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "scorsese"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
scorsese-core = { version = "0.1.0", path = "../core" }
scorsese-providers = { version = "0.1.0", path = "../providers" }
scorsese-render = { version = "0.1.0", path = "../render" }

[dev-dependencies]
serde_json = "1.0.151"
