[package]
name = "scorsese-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"

[dev-dependencies]
# Property-based tests only — see `tests/properties/`. A dev-dependency, so it
# never reaches a shipped build.
#
# Default features off, and the three kept are the ones the properties need:
# `std` for the file-backed regression persistence, `bit-set` for shrinking,
# and `handle-panics` so a panicking case is caught, shrunk and written down
# rather than taking the process with it — which is the whole point of the
# property that says `value_at` never panics. `fork` and `timeout` are the
# default features left off: they exist to survive a test that aborts or hangs,
# and they bring `rusty-fork`, `tempfile` and `wait-timeout` with them for
# arithmetic that does neither.
proptest = { version = "1.11.0", default-features = false, features = [
    "std",
    "bit-set",
    "handle-panics",
] }
