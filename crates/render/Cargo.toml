[package]
name = "scorsese-render"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
scorsese-compositor = { version = "0.1.0", path = "../compositor" }
scorsese-core = { version = "0.1.0", path = "../core" }
# For the loudness meter alone. `zimmer` is the crate that is *only* sample
# arithmetic, and a bake needs the same numbers a render does — one meter in the
# one place that is nothing but sample maths, rather than two that can disagree.
# It brings no dependency this crate does not already have.
scorsese-zimmer = { version = "0.1.0", path = "../zimmer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# A page's screenshots arrive as base64, and what it loads is answered in it
# (`page`). Already the workspace's, for the MCP server and the providers.
base64.workspace = true
thiserror = "2.0.19"
# Tracing a picture into paths (`trace`, #999): the engine under vtracer, by the
# same authors, MIT OR Apache-2.0. Taken without vtracer itself, whose 0.6
# line pulls clap 2 and image 0.23 for its command line, and whose 1.0 is an
# alpha. Pure Rust, no I/O: bit-vec, flo_curves and num-traits.
visioncortex = "0.9.3"
