<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The favicon sits on the browser's own tab bar, which follows the system's
      theme, not the app's stored one (this runs before any script): black on
      white where the system is light, white on black where it is dark. The
      first, bare link is for a browser that reads no media on an icon.
    -->
    <link rel="icon" type="image/png" href="/icon-light.png" />
    <link rel="icon" type="image/png" href="/icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/icon.png" media="(prefers-color-scheme: dark)" />
    <title>Scorsese - video editor</title>
    <!--
      What a shared link shows (#904). A link preview reads this file and runs
      no script, so it is written here, once for every URL, in English; the
      landing page sets the title and description in the visitor's language
      once it runs. The picture is a still of the film scorsese made of itself
      (web/landing/hero.scor, `make landing-og`), by absolute URL
      because the previews that matter refuse a relative one; it names the hosted
      web app, the one place these links are shared from.
    -->
    <meta
      name="description"
      content="Promos, ads and event videos for your business, made from your files and a description. No editor to hire, no software to learn."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="scorsese" />
    <meta property="og:title" content="scorsese — send your files, describe the video, it gets made" />
    <meta
      property="og:description"
      content="Promos, ads and event videos for your business, made from your files and a description."
    />
    <meta property="og:image" content="https://scorseseestudio.com/landing/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Light or dark before anything paints, so a dark page never flashes white:
      the stored choice, else light. It repeats src/lib/theme.ts's
      storedTheme (this runs before the bundle loads); theme.test.ts runs it.
    -->
    <script id="theme">
      (() => {
        var stored = null;
        try {
          stored = localStorage.getItem("scorsese-theme");
        } catch {}
        var dark = stored === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
