<!doctype html>
<html>
<head>
<link rel="stylesheet" href="look.css">
<script src="https://lib.scorsese/kit.js"></script>
<script src="out.js"></script>
<style>
  .prompt {
    position: absolute; left: 50%; top: 250px; width: 1240px; margin-left: -620px;
    padding: 48px 56px 40px; box-sizing: border-box; border-radius: 28px;
    background: rgba(244, 239, 230, 0.06);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(244, 239, 230, 0.14);
    animation: rise 800ms var(--enter) both;
  }
  .text { min-height: 200px; font: 400 54px/1.3 "Source Serif 4"; }
  .caret {
    display: inline-block; width: 4px; height: 56px; margin-left: 6px;
    vertical-align: -8px; background: var(--gold);
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; color: var(--dim); font: 500 26px Inter;
  }
  .send {
    display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%;
    background: var(--gold); color: var(--ink);
  }
  .chips span {
    display: inline-block; margin-right: 14px; padding: 10px 22px; border-radius: 999px;
    background: rgba(244, 239, 230, 0.08);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="step">02 · Describe it</div>
  <div class="prompt">
    <div class="text"><span id="typed"></span><span class="caret" id="caret"></span></div>
    <div class="bar">
      <div class="chips"><span>5 files</span><span>30 seconds</span><span>16:9</span></div>
      <div class="send" id="send"><span class="icon" style="--icon: url(https://lib.scorsese/icons/arrow-up.svg); width: 40px; height: 40px"></span></div>
    </div>
  </div>
  <div class="say" style="--at: 2.6s">Your <em>words</em>, in a sentence.</div>
</div>
<script>
  // The brief types itself out at a person's pace, then is sent.
  const brief = "A 30-second promo for our café's grand opening. Warm, upbeat, Saturday-morning light.";
  const typed = document.getElementById("typed");
  const caret = document.getElementById("caret");
  const send = document.getElementById("send");
  kit.frame((t) => {
    const shown = Math.round(kit.remap(t, 0.5, 2.6, 0, brief.length));
    typed.textContent = brief.slice(0, shown);
    caret.style.opacity = shown < brief.length || Math.floor(t * 2.5) % 2 === 0 ? 1 : 0;
    const press = kit.enter(t, 2.75, 0.25, kit.ease.back);
    send.style.transform = `scale(${1 + 0.18 * Math.sin(Math.PI * press)})`;
  });
</script>
</body>
</html>
