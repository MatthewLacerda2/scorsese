<!doctype html>
<html>
<head>
<link rel="stylesheet" href="look.css">
<style>
  body { background: radial-gradient(800px 800px at 50% 42%, #3ddbd9, #0f6e8c 55%, #082032); }
  .copy { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #fff; }
  .kicker { font: 700 40px Montserrat; letter-spacing: 12px; text-transform: uppercase; }
  .big { margin-top: 10px; font: 900 260px/0.9 Montserrat; letter-spacing: -6px; color: #fff3b0; text-shadow: 0 16px 50px rgba(0,0,0,.3); animation: rise .8s var(--enter) both; }
  .product { position: absolute; left: 50%; top: 820px; width: 560px; height: 560px; margin-left: -280px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd166 25%, #ef476f 70%); box-shadow: 0 50px 120px rgba(0,0,0,.4); animation: rise 1s .2s var(--enter) both; }
  .cta { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%); padding: 28px 64px; border-radius: 999px;
    background: #fff; color: #082032; font: 800 48px Montserrat; white-space: nowrap; }
</style>
</head>
<body>
  <div class="copy"><div class="kicker">Summer sale</div><div class="big">−30%</div></div>
  <div class="product"></div>
  <div class="cta">Shop this week</div>
</body>
</html>
