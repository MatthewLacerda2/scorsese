# cargo-mutants: which code gets mutated, and why it stops where it does.
#
# Mutation testing answers the question coverage cannot: *if this line were
# wrong, would anything notice?* A line can be executed by ten tests and
# asserted on by none. Two things route the result: the `mutants` job in
# `.github/workflows/ci.yml`, which scopes to a pull request's own diff, and
# `.github/workflows/mutation-sweep.yml`, which sweeps one whole crate of the
# surface below every week so that the code no recent diff touched is audited
# too. `docs/mutation-testing.md` holds the policy this file implements —
# including what to do with a survivor.
#
# Run it:
#
#     make mutants     # this branch's diff, exactly as the CI job scopes it
#     cargo mutants    # the whole surface below: 3676 mutants today, and
#                      # `cargo mutants --list | wc -l` re-counts it for free —
#                      # that builds nothing, so the number is exact and cheap
#
# ---------------------------------------------------------------------------
# The floor under that count
# ---------------------------------------------------------------------------
#
# A *floor*, and not the count itself. Writing code adds mutants and must never
# break a check; what this is here to notice is the surface being **deleted** —
# #363 and #365, where three `exclude_re` entries below were regexes that
# matched every mutant there is and left six. So the number below sits well
# under today's count with room for an ordinary refactor or a deliberate
# exclusion, and nowhere near the two-digit wreckage a runaway entry leaves.
#
# `.github/scripts/mutation-surface.py` reads the line — a comment and not a
# config key, because cargo-mutants rejects an unknown field outright and
# `surface_floor = 3000` here would break every run to guard against runs being
# broken. `make mutants` checks it before it mutates anything and the `mutants`
# CI job checks it first; neither is in `make gates`, because this proves the
# *instrument* works rather than that the code is right.
#
# Lower it only in the same commit that shrinks the surface on purpose, with
# the reason. Lowering it to make the check quiet is the same move as
# re-blessing a golden reference to make CI green.
#
# surface-floor: 3000
#
# ---------------------------------------------------------------------------
# The mutated surface
# ---------------------------------------------------------------------------
#
# Only the pure-logic surface, for two reasons that happen to point the same
# way — it is where mutation is *accurate*, and it is where it is *cheap*.
#
# In scope:
#
# - `crates/core` — validation, the keyframe evaluator, the rational-framerate
#   arithmetic, the asset pool. No ffmpeg anywhere in it; its tests answer in
#   under a second.
# - `crates/compositor` — property resolution and the CPU compositor. Pure
#   pixel arithmetic over in-memory frames.
# - `crates/render/src/plan/`, `src/audio/mix.rs`, `src/audio/gain.rs` —
#   sequencing, sample mixing, gain. Arithmetic decisions whose wrong answer is
#   a wrong video, and none of them shell out.
# - `crates/zimmer` — synthesis: oscillators, envelopes, filters, effects, the
#   level maths, the tracker-style arrangement. It scores on both halves of the
#   rule above harder than anything else here. *Accurate*, because the crate's
#   stated boundary is no I/O of any kind and no dependency on `scorsese-core`
#   — every output is a pure function of the documents handed in, so a survivor
#   cannot be blamed on a stub, a fixture or a clock. *Cheap*, because nothing
#   in it decodes media. And its arithmetic is the shape mutation reads best: a
#   flipped operator in an envelope makes sound that is *wrong* rather than
#   sound that is absent, and a test measuring a range rather than a value will
#   not object — the same failure as `Mix::add` mixing by subtraction with the
#   whole suite green (#60).
#
# Deliberately out of scope:
#
# - `crates/render/src/pipe/` — builds ffmpeg command lines. Both the slow part
#   and the part mutation judges worst: a mutated argument string makes ffmpeg
#   fail loudly rather than subtly, so nearly every mutant there is caught for
#   a reason that says nothing about the tests.
# - `crates/render/src/probe/`, `run.rs`, `raster.rs`, `report.rs` — the same
#   argument, plus every mutant costs a real decode.
# - `crates/golden` — test infrastructure. Measuring whether the tests test the
#   test harness measures the wrong thing.
# - `crates/cli`, `crates/mcp`, `crates/providers` — thin wrappers and
#   trait definitions over the logic above; mutating an argument-parsing arm
#   reports on `clap`, not on us.
# - `tools/lint` — its own workspace, not reachable from this one at all.
#
# Adding a crate here is a deliberate change: it moves per-PR CI cost, so make
# it in its own commit with the measured before-and-after.
#
# What zimmer cost, measured for #289:
#
# - **The surface, exactly.** 1718 mutants before, 3018 after — zimmer is 1300
#   of them, +76%. `cargo mutants --list` builds nothing and runs nothing, so
#   this number depends only on the source and the tool version and is the same
#   on every machine. Stamped, because it moves with the tool: cargo-mutants
#   27.1.0.
# - **What CI pays per pull request: nothing extra, for almost every PR.** The
#   `mutants` job runs `--in-diff`, so this file decides which of a diff's
#   changed lines are *mutable*, never how many get mutated. A PR that does not
#   touch `crates/zimmer` costs exactly what it did before. A PR that does now
#   gets a signal where it previously got silence, priced by the size of its own
#   diff — not by the 1300 above, which is a ceiling nobody pays per PR.
# - **Is the surface earning its keep?** A *partial* sweep — 53 of zimmer's
#   1300 mutants, stopped on purpose rather than run out — came back 38 caught,
#   10 missed, 5 unviable. A catch rate around four in five on first contact is
#   the answer that makes a surface worth having: the crate's tests already
#   object to most of what this tool can break, so the report is a short list to
#   read rather than a wall to ignore. The survivors are not this file's
#   business — per docs/mutation-testing.md a survivor is its own issue.
# - **Wall clock is deliberately not quoted here.** The one measurement taken
#   was on darwin/arm64 with four other cargo builds running (load average ~33
#   on ten cores), where the same tool reported anything from 1s to 128s to
#   build a mutant. That is a number about a busy laptop, not about a cold
#   GitHub-hosted `ubuntu-24.04` runner at `--jobs 2`, and quoting it would be
#   inventing a CI figure. The mutant count is the honest before-and-after; the
#   job's own `timeout-minutes: 30` is the backstop if a zimmer-heavy diff ever
#   turns out to be slow in practice.
examine_globs = [
    "crates/core/src/**/*.rs",
    "crates/compositor/src/**/*.rs",
    "crates/render/src/plan/**/*.rs",
    "crates/render/src/audio/mix.rs",
    "crates/render/src/audio/gain.rs",
    "crates/zimmer/src/**/*.rs",
]

# `examine_globs` already decides this — these say it a second time because a
# `--file` on the command line is *unioned* with the globs above rather than
# narrowing them, so a hand-run can widen the scope by accident. Exclusions are
# applied after, which is what makes them hold.
#
# Narrowing a hand-run further splits the flags into two kinds, and only one of
# them is trustworthy. *File* filters — these globs, `--exclude`, `--package` —
# pick the files before a single mutant is generated, so they hold for every kind
# of mutant there is. *Name* filters — `--re`, and `exclude_re` below — sieve the
# mutants afterwards by the string `--list` prints, and in cargo-mutants 27.1.0
# one genre slips through the sieve: the struct-field deletions
# (`delete field … from struct …`, a mutation only added in 26.0.0) are neither
# kept out by `--re` nor removed by `--exclude-re`. There are 23 of them on the
# surface above, and `cargo mutants --list --re 'matches nothing at all'` prints
# all 23 and nothing else, which is the whole demonstration.
#
# So `--re '^path/to/file\.rs'` is still the way to point a hand-run at one file
# — it is just not a promise about which files get tested. Those 23 strays ride
# along from wherever they live and the report describes them too, so read past
# any `delete field` row from a file you did not name. `-p scorsese-core` narrows
# to a whole crate with no strays at all, because it decides what to visit rather
# than what to keep. Nothing narrows to exactly one file.
exclude_globs = [
    "crates/render/src/pipe/**/*.rs",
    "crates/golden/**/*.rs",
]

# ---------------------------------------------------------------------------
# Equivalent mutants
# ---------------------------------------------------------------------------
#
# An *equivalent mutant* changes the code without changing its behaviour, so no
# test can possibly catch it and it surfaces as a survivor needing no fix.
# The policy, in full:
#
#   A survivor is a test gap until it is shown to be equivalent. Showing that
#   means an entry below with a written reason. It never means weakening or
#   deleting an assertion to make the report quieter — a test changed to suit a
#   tool has stopped testing the code.
#
# `exclude_re` matches the mutant name as `cargo mutants --list` prints it, so
# an entry names one mutation of one function and cannot silently grow to cover
# a real gap that appears next to it later. The reason goes here, next to the
# entry — not in a commit message nobody will find.
#
# **An entry is a regular expression, not the printed line.** It reads like the
# line because most mutant names are made of letters, and that is the trap: a
# mutation *of an operator* puts regex metacharacters in the name, and `||` is
# the one that costs everything. `replace || with && in unit` is an alternation
# with an empty branch in it, an empty branch matches every string there is, and
# a single entry like that therefore excludes the whole surface. It is silent
# when it happens — the run reports a handful of mutants and passes — so the
# entries below are TOML *literal* strings (single quotes, no escape processing)
# and every metacharacter in one is backslash-escaped. `cargo mutants --list |
# wc -l` is the check: it builds nothing, and the count it prints is four
# figures. Six is what this file looks like when an entry has eaten everything.
#
# One exception, per the note above `exclude_globs`: a struct-field deletion
# cannot be excluded here at all — an entry for one is accepted and does
# nothing, and the mutant is still reported.
exclude_re = [
    # `Properties::is_identity` compares five `f64` differences against a
    # tolerance: `(x - 1.0).abs() < 1e-9`. Widening `<` to `<=` changes the
    # answer only for a difference that is *exactly* 1e-9, and 1e-9 is not
    # representable in binary floating point — no input can be constructed that
    # tells the two apart. Genuinely equivalent, so no test is owed.
    #
    # Excluded and not fixed, and the distinction matters: an epsilon boundary
    # that could be hit is a gap, and the identical-looking mutation would be
    # reported as a survivor from a function whose tolerance is reachable.
    'replace < with <= in Properties::is_identity',

    # `segments::cuts` collects the frames at which the visible set can change.
    # It seeds the list with `[start, end]`, then adds each clip boundary that
    # `at > start && at < end` calls *inside* — and finishes with
    # `sort_unstable()` followed by `dedup()`.
    #
    # That dedup is what makes both of these equivalent. Loosening either end of
    # `inside` changes the answer for exactly one boundary value — a clip
    # starting on `start`, or ending on `end` — and that value is already in the
    # list. The mutant pushes a second copy of a frame that is then deduplicated
    # away, so the returned cuts are identical for every input. No test can tell
    # the two apart, and a test that tried would be asserting on a `Vec` that
    # cannot differ.
    #
    # The comparisons themselves are still load-bearing, and the mutations that
    # *are* caught say so: `>` to `<`, `>` to `==`, `<` to `>` and `<` to `==`
    # each admit boundaries from outside the rendered range and are killed by
    # the range tests. Only the one-frame widening is absorbed.
    'replace > with >= in cuts',
    'replace < with <= in cuts',

    # `shape::arrow::Run::of` opens with `!dx.is_finite() || !dy.is_finite()`, and
    # every path out of it then goes through `unit`, which takes `dx.hypot(dy)` and
    # answers `None` unless that length is finite and above zero. A non-finite
    # component makes the hypotenuse non-finite whichever component it was — so
    # with `&&`, an arrow carrying one bad coordinate is not turned away here, it
    # is turned away one call later. `Run::of` answers `None` for the same set of
    # inputs either way, and an arrow it answers `None` for draws nothing.
    #
    # The guard stays because it says what the function assumes at the top of it,
    # and the rest of the condition is load-bearing: deleting either `!` refuses
    # every ordinary arrow and is killed by the drawing tests.
    'replace \|\| with && in Run::of',

    # `shape::arrow::unit` refuses a run it cannot take a direction from with
    # `!length.is_finite() || length <= 0.0`, where `length` is `dx.hypot(dy)`.
    # A hypotenuse is never negative, so `<= 0.0` means *exactly* zero, and it is
    # only zero when both components are — the two ends of the arrow in the same
    # place. Narrowing to `&&` lets that one case through to `dx / length`, which
    # is `0.0 / 0.0` and therefore `NaN`, and tiny-skia's `PathBuilder` refuses a
    # non-finite point: the head's path comes back empty and the zero-length line
    # under it strokes to nothing. Both versions leave the raster untouched, which
    # is what `arrows.rs` asserts by measuring the whole frame's extent rather
    # than one pixel of it.
    #
    # The non-finite half of the condition is unreachable from here rather than
    # equivalent: `Run::of` has already refused a non-finite endpoint before
    # `unit` is called on one.
    'replace \|\| with && in unit',

    # `shape::closed::bounds` refuses a size that could not describe a rectangle —
    # zero, negative, or not a number — with
    # `!w.is_finite() || !h.is_finite() || w <= 0.0 || h <= 0.0`, and then hands
    # the numbers it kept to `Rect::from_xywh`, which refuses *exactly* the same
    # set and answers `None` for it. Narrowing any one of the three `||`s to `&&`
    # lets a bad size past the early return and straight into a constructor that
    # turns it away, so `bounds` answers `None` for every input either way. Three
    # mutants and one entry, because there is one reason.
    #
    # The comparisons themselves are still load-bearing, and the mutations that
    # *are* caught say so: deleting either `!`, or widening either `<=` to `>`,
    # refuses sizes that are perfectly good, and the drawing tests kill all four.
    'replace \|\| with && in bounds',

    # `blur::radius` turns a fraction of a layer's height into a count of pixels
    # and refuses everything that softens nothing with
    # `pixels.is_nan() || pixels < 0.5`. Narrowing it to `&&` makes the guard
    # unreachable rather than narrower — NaN is not less than anything, so the
    # conjunction is false for *every* input — and each input the early return
    # used to catch falls through to the one expression the function ends in,
    # `(pixels.round() as usize).min(height as usize)`, which answers zero for all
    # of them: Rust's float-to-integer cast saturates, so NaN becomes 0 and a
    # negative becomes 0, and anything in `[0, 0.5)` rounds to 0 before the cast
    # sees it. Both infinities agree too — `-inf` saturates to 0, `inf` saturates
    # past `height` and is clamped to it, either way round. Same answer for every
    # `f64` there is, confirmed by hand as well as by the tool: with `&&` in place
    # of `||`, the whole of `scorsese-compositor`'s suite passes.
    #
    # The guard stays because it names NaN where somebody reads the function
    # instead of leaving the answer to a cast's saturation rule, which is what its
    # comment says. And the comparison in it is load-bearing: `< 0.5` widened to
    # `<= 0.5`, or turned into `== 0.5`, changes the answer at *exactly* half a
    # pixel — a boundary that is reachable, exactly representable, and now
    # asserted by `half_a_pixel_is_the_narrowest_blur_there_is`.
    #
    # The `||` is escaped because this is a regex and not the printed line: see
    # #363, which is what an unescaped one does to the whole surface.
    'replace \|\| with && in radius',
]

# ---------------------------------------------------------------------------
# Execution
# ---------------------------------------------------------------------------

# How wide a run fans out: **two jobs**, everywhere.
#
# The one number in this section that is not a key below it, and not for want
# of trying. cargo-mutants 27.1.0 takes `--jobs` from the command line or from
# `CARGO_MUTANTS_JOBS`, and from nowhere else — `cargo mutants --emit-schema
# config` prints what a config file is allowed to hold and `jobs` is not on the
# list. So all three callers pass the flag: the `mutants` target in `Makefile`,
# the `mutants` job in `.github/workflows/ci.yml`, and the sweep in
# `.github/workflows/mutation-sweep.yml`. This is where the reason lives, once,
# and each of them points here rather than restating it — three places holding
# a bare number and no argument is how they came apart to begin with (#398).
#
# Left unset the default is the CPU count, and that is the wrong resource to
# size against. Every job is a whole cargo build inside its own copy of the
# worktree, and what runs out first is not threads but memory: rustc's peak is
# measured in gigabytes and linking is where it lands. Eight of them took the
# development machine down twice in one day, and the OOM killer named the
# editor session rather than the compiler that had eaten the RAM.
#
# Two on both machines for the same reason rather than by imitation. They
# differ in threads — 8 here against a public repo's four-core hosted runner —
# and agree at around 16 GB of RAM, so the constraint that binds is the one
# they share. What the runner does not carry is everything else on a desktop:
# an editor, a browser, the agent session itself, and per CLAUDE.md as many
# sibling worktrees compiling as the machine can stand. Local headroom is
# smaller than CI's and never larger, so the local number does not go above
# CI's; `MUTANTS_JOBS` in the `Makefile` exists for the afternoon it should go
# below.
#
# Two jobs is not six threads left idle. cargo's own parallelism inside each
# mutant fills them, bounded across every child process by the jobserver
# (`--jobserver-tasks`, NCPUS by default). What this caps is how many *builds*
# are in flight at once, which is what peak memory tracks — not how much of the
# machine any one of them may use.

# The failure mode this exists for: a mutant that turns a loop bound into a
# constant produces code that never terminates, and without a timeout the job
# waits for the runner's six-hour limit instead of reporting it. cargo-mutants
# times the unmutated baseline and caps each mutant at a multiple of it; 5x is
# loose enough that a slow runner is not mistaken for a hang.
timeout_multiplier = 5.0

# The floor under that multiple. `crates/core`'s tests finish in ~0.2s, and 5x
# of that would call a mutant a hang for being scheduled behind something else.
# A real infinite loop still stops at 30 seconds.
minimum_test_timeout = 30.0

# Tests from the mutated package only, not the whole workspace. This is the
# decision that makes the cost bearable: a mutant in `crates/core` runs core's
# tests in ~0.2s instead of rebuilding every crate behind it and rendering the
# golden fixtures, which #323 measured at 81s of build and 48s of tests for one
# mutant of `crates/compositor`.
#
# The trade-off is real and accepted: a `core` mutant that *only* a golden
# render would have caught is reported as surviving. That is the conservative
# direction to be wrong in — it over-reports work rather than under-reporting
# it — and it matches what the signal is for. A behaviour whose only assertion
# is a pixel comparison three crates away is a thin assertion in its own right.
#
# **Asked and answered for `crates/compositor` in #323, which is the crate this
# is least comfortable about**: its strongest assertions really are the golden
# fixtures, so it is where `false` over-reports most, and the question was
# whether to turn the setting on for it. The answer is no. The numbers, from the
# 224 mutants of `shape/` and `paint.rs` run as configured, and fourteen of their
# survivors run again with `--test-package scorsese-compositor --test-package
# scorsese-golden` — the narrowest way to put the pixel gate in front of a
# compositor mutant:
#
# - **26× per mutant.** 3–5s build + 1–2s test becomes 81s + 48s, because a
#   change to `scorsese-compositor` rebuilds `scorsese-render` and
#   `scorsese-golden` behind it and then renders 44 fixtures through ffmpeg.
#   Those 224 go from about twelve minutes to over four hours on the machine this
#   is developed on, against the six-hour job limit the weekly sweep already
#   sizes itself to.
# - **It is two settings, not one.** At the 30-second floor above, the
#   golden-inclusive run reports TIMEOUT instead of an outcome — two of its first
#   three mutants did — because a 48-second test against a baseline timed at two
#   seconds is indistinguishable from a hang. A timeout is neither caught nor
#   missed, so the floor would have to move too, and the floor is what stops a
#   genuine infinite loop being waited on for six hours.
# - **It buys 6 of 14.** The fixtures kill six — the blend arithmetic, `area_of`,
#   a head's spread, and three of the rounded rectangle's control points — and
#   miss eight. All eight are in the arrow, where each fixture draws one bow along
#   one axis and the mutations live in the branch it does not take. So the
#   fixtures are not a substitute for assertions beside the code; they are a
#   second and much slower opinion about part of it.
#
# What settles it is that the six are not lost by leaving this `false`. #323 wrote
# unit tests that kill them for nothing — a shape's extent and the area it covers,
# measured rather than sampled — and those run on every pull request in two
# seconds. A mutant killed cheaply is worth strictly more than the same mutant
# killed expensively, because only the cheap one is affordable per diff. So the
# over-reporting above reads as an instruction rather than as a defect: it says
# *put the assertion next to the code*, and doing that is both the cheaper answer
# and the better one.
test_workspace = false

# ---------------------------------------------------------------------------
# What gets copied
# ---------------------------------------------------------------------------
#
# Every mutant is built in a *copy* of this worktree, made under `$TMPDIR`, and
# in cargo-mutants 27.1.0 that copy is taken with gitignore matching **off by
# default**: every byte of build output in the tree is copied for a run that
# will never mutate a line of it. The top-level `target/` escapes only by a
# special case of its own — `copy_target`, false by default and top-level only.
# `app/target/` is neither. It is a separate cargo workspace that
# `examine_globs` above scopes no mutants into at all, and once the app gate has
# built it, it is about 8.5 GB; on the development machine `/tmp` is a 7.8 GB
# tmpfs — RAM, not disk — so the copy died of "Disk quota exceeded" before a
# single mutant existed (#392). The ordering made it a trap rather than a
# nuisance: `make gates` runs the app gate last, and the mutation signal is run
# right after it.
#
# Turning gitignore matching on is the fix, and it is the honest one because it
# reuses the answer this repo already gives to *what here is build output*
# rather than keeping a second list beside `.gitignore` for it to drift from.
# Nothing it excludes can be needed: a gitignored path is not in a fresh clone,
# and the tests pass in one. It subsumes `copy_target` too — a gitignored
# `target/` is not copied whatever that setting says — so there is one key here
# and one reason for it.
#
# This shrinks the copy; it does not decide where the copy lands. `make mutants`
# sets `TMPDIR` to a disk-backed directory for that, because a run that assumes
# `/tmp` is disk is one machine away from being wrong again.
gitignore = true
