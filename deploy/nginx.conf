# The one routing rule: `/api` goes to the server, everything else is the React
# build (docs/web.md, "Every route lives under /api").
#
# It lives here and not in the Cloudflare Tunnel's ingress rules, deliberately:
# - The tunnel's rules are Cloudflare's, kept in deploy/terraform (#957), and a
#   split there is one no local run can exercise; here it is identical on
#   http://127.0.0.1:$SCORSESE_WEB_PORT and on the public hostname.
# - nginx has to be here anyway for the SPA fallback below, so the tunnel's
#   ingress names hostnames, each "everything to web", and nothing else.
# The cost is one extra local hop for API traffic, which is nothing next to the
# internet round trip in front of it.
#
# The MCP endpoint (#539) is /api/mcp, under /api like every other route, so it
# needs nothing here.

# Docker's embedded DNS, re-asked every 10s. A variable in `proxy_pass` makes
# nginx resolve `server` per request instead of once at startup, so the static
# site starts without the server and follows it across restarts, when its
# address can change.
resolver 127.0.0.11 valid=10s ipv6=off;

# Where a request came from, for the access record Marco Civil asks for
# (#1267, crates/server/src/accounts/access.rs; it was for the login's brake,
# #557, until #952). nginx has two doors, and which one a request came through
# is what decides whose word to take for its address:
#
# - Port 80 is the tunnel's door. compose.yaml publishes it to nothing, so the
#   only things that can reach it are the containers on the compose network,
#   and of those only cloudflared ever connects here. Cloudflare writes the
#   visitor's address into CF-Connecting-IP itself, so it is believed.
# - Port 8080 is this machine's door: loopback, `tailscale serve`, the LAN,
#   published by compose.yaml. CF-Connecting-IP there is whatever the client
#   chose to type, so it is ignored and the connection's own address is used.
#
# Either way the result goes to the server as X-Scorsese-Client, which
# proxy_set_header writes over anything the client sent under that name. The
# server believes it because nothing but this nginx can reach the server:
# compose.yaml publishes its port to nothing.
# crates/server/src/http/visitor.rs has the rest.
#
# The door is the port and not an address range on purpose: container
# addresses are Docker's to hand out, and a rule written against them would
# break the day a network is recreated, silently, in the direction of trusting
# a header it should not.
map $server_port $scorsese_client {
    80      $http_cf_connecting_ip;
    default $remote_addr;
}

# Where the visitor is, roughly, and the request's id at Cloudflare, for the
# access log (#1526). Cloudflare adds these on the tunnel's door
# (deploy/terraform/cloudflare/transforms.tf, and `cf-ray` always); on 8080
# they are whatever the client typed, so they are blank there, by the same rule
# as the address. City, region and country only: the latitude, longitude and
# postal code Cloudflare also sends are more than the log's purpose needs.
# `T1` as the country is Tor, and stays as it is.
map $server_port $scorsese_city {
    80      $http_cf_ipcity;
    default "";
}
map $server_port $scorsese_region {
    80      $http_cf_region_code;
    default "";
}
map $server_port $scorsese_country {
    80      $http_cf_ipcountry;
    default "";
}
map $server_port $scorsese_ray {
    80      $http_cf_ray;
    default "";
}

# The visitor's address first, the one the server is told; then the usual
# request, status, size, referrer and browser; then where and which ray.
# Nothing else about who: a signed-in visitor is named by account id in the
# server's own log, never here. `escape=json` keeps a city's UTF-8 as it is
# ("São Paulo"; Cloudflare sends UTF-8) while still escaping quotes and control
# characters, so a header cannot forge a line; it logs a blank value as
# blank, which is why every field that can be blank is quoted.
log_format visitors escape=json
    '$scorsese_client [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    '"$scorsese_city" "$scorsese_region" "$scorsese_country" "$scorsese_ray"';

server {
    # The tunnel's door; see the map above.
    listen 80;
    # This machine's door.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cloudflare's free plan refuses a request body over 100 MB before it gets
    # here; matching it locally means nothing works on loopback that would fail
    # in production. Uploads are chunked (tus) to fit under it.
    client_max_body_size 100m;

    # The image links this file to stdout, and so to the journal
    # (compose.yaml); in the format above.
    access_log /var/log/nginx/access.log visitors;

    # The healthcheck's (compose.yaml), every 30 s, kept out of the log. It
    # answers with the app's shell, so a build missing its index.html is
    # unhealthy.
    location = /healthz {
        access_log off;
        try_files /index.html =404;
    }

    location /api/ {
        set $api http://server:8080;
        # No URI part, so the request's own path — /api prefix included — is
        # what the server sees.
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The client's address, as the map at the top decides it. Never
        # empty behind Cloudflare; if it ever were, nginx would drop the
        # header, and the server would record nginx's own address instead.
        proxy_set_header X-Scorsese-Client $scorsese_client;
        # Streamed both ways: an upload chunk goes straight through rather than
        # being spooled to nginx's disk first, and progress the server streams
        # back arrives as it is written.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # WebSocket upgrades, should live progress use one.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Vite fingerprints everything under /assets, so a file there never changes
    # under its name and can be kept forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a page of the single-page app: serve the shell and let
    # the client router decide. It is never cached, so a deploy is seen on the
    # next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}
