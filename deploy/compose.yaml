# The hosted web app, on the maintainer's machine (#532).
#
#   cd deploy && docker compose up --detach --build
#
# docs/web.md, "Running the service", is the runbook: first-time setup, updating
# and restoring. Everything this file needs from outside is in `.env` beside it,
# and `.env.example` documents every variable; `make deploy` refuses a variable
# used here that the example does not describe.
#
# The traffic path, outside in: Cloudflare's edge terminates HTTPS and hands the
# request down the tunnel `cloudflared` holds open; `cloudflared` sends all of
# it to `web`; `web` (nginx) serves the React build and passes `/api` to
# `server`. The split lives in nginx.conf rather than in the tunnel's ingress
# rules because a token-run tunnel keeps its rules in Cloudflare's dashboard,
# out of version control and out of reach of a local test — see nginx.conf.
#
# The tunnel is chosen in `.env`, by COMPOSE_PROFILES, without editing this
# file: `named-tunnel` (production: a domain and a token), `quick-tunnel` (a
# random *.trycloudflare.com address, for testing before there is a domain), or
# neither (no tunnel at all — loopback and a tailnet only). A profile, because
# a service outside the active ones is not started, and the choice is written
# down in the one file that already holds every other setting.
#
# Nothing is published to the network by default. `web` answers on
# SCORSESE_WEB_BIND, which is loopback unless `.env` says otherwise, so the site
# can be checked without a tunnel and `tailscale serve` can put it on a tailnet
# over HTTPS (docs/web.md, "Testing before there is a domain").
#
# `restart: unless-stopped` everywhere: after a power cut the Docker daemon
# starts at boot and brings back every container that was running, and a
# container that crashes is restarted. `docker compose stop` is the one thing
# that keeps one down. The job queue is what resumes interrupted work; this
# only brings the processes back.

name: scorsese

# What both tunnels share. They differ only in how cloudflared is told which
# tunnel it is. Both send everything to http://web:80, nginx's tunnel-only
# door, where CF-Connecting-IP is believed as the visitor's address
# (nginx.conf, #557) — never to 8080, where it would count every visitor on the
# internet as one.
x-cloudflared: &cloudflared
  # Pinned: this is the one container that talks to the internet, and an
  # update to it is a deliberate change like any other.
  image: cloudflare/cloudflared:2026.9.3
  restart: unless-stopped
  depends_on:
    web:
      condition: service_healthy
  # No healthcheck: the image has no shell or HTTP client to run one with,
  # and a tunnel that loses its connection retries by itself.

services:
  postgres:
    # The same image the tests and CI run (tools/with-postgres,
    # .github/workflows/ci.yml): change all three together. The backup image
    # builds on it too, so pg_dump always matches the server it dumps.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorsese
      POSTGRES_DB: scorsese
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the image's first boot runs a socket-only server while it
      # initialises, which a socket probe would call ready (tools/with-postgres).
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "scorsese", "--dbname", "scorsese"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        # Unset means cargo's default (every core). The machine this runs on
        # also runs `make gates`; set it in the shell to leave room.
        - CARGO_BUILD_JOBS
    image: scorsese-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The host user, so files it writes under SCORSESE_DATA are the
    # maintainer's to read, back up and restore, not root's.
    user: "${SCORSESE_UID:?set SCORSESE_UID in deploy/.env}:${SCORSESE_GID:?set SCORSESE_GID in deploy/.env}"
    environment:
      DATABASE_URL: postgres://scorsese:${POSTGRES_PASSWORD}@postgres:5432/scorsese
      SCORSESE_STORAGE: /data/library
      # Beside the library, never inside it: thumbnails, half-arrived uploads
      # and finished renders are not worth shipping off the machine every
      # night.
      SCORSESE_CACHE: /data/cache
      SCORSESE_RENDER_QUOTA: ${SCORSESE_RENDER_QUOTA:?set SCORSESE_RENDER_QUOTA in deploy/.env}
      # Every interface of the container, which is only the compose network:
      # no port is published, so nothing outside reaches this but nginx.
      SCORSESE_BIND: 0.0.0.0:8080
      # Believe the client address nginx names in X-Scorsese-Client, for the
      # login's brake (#557). True here and nowhere else: it is safe exactly
      # because of the line above — no port published, nginx the only thing
      # that reaches this — and nginx.conf has which address it names.
      SCORSESE_TRUST_PROXY: "true"
      # The operator's provider keys, for users' paid generations. Blank means
      # a generation needing one fails, free.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # The assistant's key and limits. A blank key means the assistant
      # answers "not configured"; blank limits are the server's defaults.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCORSESE_ASSISTANT_TURN_CAP: ${SCORSESE_ASSISTANT_TURN_CAP:-}
    volumes:
      - &data
        type: bind
        source: ${SCORSESE_DATA:?set SCORSESE_DATA in deploy/.env}
        target: /data
        # A missing directory is a typo or an unmounted disk. Docker would
        # create it, root-owned and empty, and the service would start on it.
        bind:
          create_host_path: false
    healthcheck:
      # 503 while the database does not answer, so this is the whole service.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Migrations run before the first request; a long one must not read as
      # a dead server and get restarted halfway through.
      start_period: 120s

  # Users' web pages, drawn by a browser (#778), each capture in a container
  # of its own that mounts only its job (#852). Somebody else's code on this
  # machine, so every capture has no network at all, no capability, a
  # read-only root, a user that is not root, Chromium's own sandbox on — which
  # needs only the one seccomp rule in capture/seccomp.json (#773 has the
  # measurement) — and #773's caps. Those flags are not here: they are written
  # in crates/server/src/captures/launch, the only `docker run` this service
  # ever makes, so nothing a job says can change them.
  #
  # This container starts them. It holds the Docker socket, which is root on
  # this machine, so it holds nothing else: no network, no database, no
  # secret, no capability, and nothing to run but that one command. The server
  # hands it work through the spool under SCORSESE_CACHE, and never touches
  # the socket itself (crates/server/src/captures has why).
  capture-launcher:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: launcher
      args:
        - CARGO_BUILD_JOBS
    image: scorsese-capture-launcher
    # Healthy, because the server makes the spool before it answers, and the
    # spool is mounted when this starts (`capture-spool` at the bottom); and
    # the server's build makes the image every capture runs, which the
    # launcher checks for when it starts.
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    # Where things are is said here, by the operator, never by a job: the
    # paths the server sees, the host's path for the same folder (a mount's
    # source is the host's), and who the captures run as.
    command:
      - scorsese-server
      - capture-launcher
      - --spool=/data/cache/captures
      - --library=/data/library
      - --data=/data
      - --host-data=${SCORSESE_DATA}
      - --user=${SCORSESE_UID}:${SCORSESE_GID}
    # A PID 1 that reaps the Docker clients a deadline kills.
    init: true
    network_mode: none
    user: "${SCORSESE_UID}:${SCORSESE_GID}"
    # The socket's group, so the host user can reach it without being root.
    group_add:
      - "${SCORSESE_DOCKER_GID:?set SCORSESE_DOCKER_GID in deploy/.env}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # The Docker client's HOME.
    tmpfs:
      - /tmp:rw,size=16m
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # Every capture's seccomp profile, which the client reads and sends.
      - type: bind
        source: ./capture/seccomp.json
        target: /etc/scorsese/capture-seccomp.json
        read_only: true
      # The library, read-only, to check each file a job's project links to
      # is its owner's before mounting that file and no other.
      - type: bind
        source: ${SCORSESE_DATA}/library
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
      # The spool: each job's project, each project's page cache, and the
      # answers. A volume, not a bind like the two above — `capture-spool`
      # below has why.
      - type: volume
        source: capture-spool
        target: /data/cache/captures
        volume:
          nocopy: true

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: scorsese-web
    restart: unless-stopped
    # Ordering only. nginx re-resolves `server` as it goes (nginx.conf), so the
    # static site comes up and stays up while the server restarts; `/api`
    # answers 502 in between, which is the truth.
    depends_on:
      - server
    # nginx's second door, 8080, is the one published: loopback, `tailscale
    # serve` and the LAN come in there. Its port 80 is the tunnel's alone and
    # published to nothing, because a request on it is believed about where
    # it came from (nginx.conf, #557). Publish 80 and anyone who can reach
    # the port can say they are anybody.
    ports:
      - "${SCORSESE_WEB_BIND:?set SCORSESE_WEB_BIND in deploy/.env}:${SCORSESE_WEB_PORT:?set SCORSESE_WEB_PORT in deploy/.env}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  named-tunnel:
    <<: *cloudflared
    profiles: [named-tunnel]
    # A remotely-managed tunnel: the token carries the tunnel's identity and
    # Cloudflare's dashboard carries its one public hostname, pointed at
    # http://web:80. No certificate or config file lives on this machine.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Not `:?` like the rest: Compose interpolates the whole file before it
      # looks at profiles, so a required token would be required by the quick
      # tunnel and by no tunnel too. A blank one in this mode is cloudflared
      # refusing to start, in `docker compose logs named-tunnel`.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  quick-tunnel:
    <<: *cloudflared
    profiles: [quick-tunnel]
    # No account, no token, no domain: Cloudflare hands out a random
    # https://<words>.trycloudflare.com and forgets it when this stops, so a
    # restart is a new address. It is printed in the log:
    #   docker compose logs quick-tunnel | grep -o 'https://[-a-z0-9]*\.trycloudflare\.com'
    # Cloudflare's own limits: 200 requests in flight, and no server-sent
    # events, so live progress (/api/events) does not stream through it.
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]

  backup:
    build:
      context: backup
    image: scorsese-backup
    restart: unless-stopped
    # PID 1 that forwards SIGTERM, so `docker compose stop` does not wait out
    # the backup loop's sleep.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    user: "${SCORSESE_UID}:${SCORSESE_GID}"
    environment:
      PGHOST: postgres
      PGUSER: scorsese
      PGDATABASE: scorsese
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SCORSESE_BACKUP_REMOTE: ${SCORSESE_BACKUP_REMOTE:?set SCORSESE_BACKUP_REMOTE in deploy/.env}
      SCORSESE_BACKUP_EVERY_HOURS: ${SCORSESE_BACKUP_EVERY_HOURS:?set SCORSESE_BACKUP_EVERY_HOURS in deploy/.env}
      SCORSESE_BACKUP_KEEP_DAYS: ${SCORSESE_BACKUP_KEEP_DAYS:?set SCORSESE_BACKUP_KEEP_DAYS in deploy/.env}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      # rclone writes a cache and, for OAuth remotes, refreshed tokens; the
      # host user has no home directory inside this image.
      HOME: /tmp
    volumes:
      - *data
      - type: bind
        source: ${SCORSESE_RCLONE_CONFIG:?set SCORSESE_RCLONE_CONFIG in deploy/.env}
        target: /config/rclone
        bind:
          create_host_path: false
    healthcheck:
      # Healthy while the last good backup is younger than two intervals, so
      # a backup that has quietly stopped working shows in `docker compose ps`.
      test: ["CMD", "backup-fresh"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1h

volumes:
  postgres-data:

  # The capture spool, $SCORSESE_DATA/cache/captures, bind-mounted into
  # capture-launcher and nothing else. The server makes that folder when it
  # starts, so on a host it has never run on the folder is not there yet — and
  # Compose creates every container before it starts any. A bind is checked
  # when its container is created, so the launcher's failed and took the
  # update down with it (#861); a volume is mounted when its container starts,
  # which `depends_on` puts after the server is healthy and the folder made.
  # The folder stays the host user's: neither Docker nor Compose creates it
  # (`create_host_path` would, as root, and the server could not write in it).
  #
  # The volume only names the folder, so `docker compose down --volumes`
  # leaves what is in it alone. It remembers the path it was made with,
  # though: after SCORSESE_DATA moves, `up` asks to recreate it, and the
  # answer is yes — its warning that data will be lost is about volumes that
  # hold their own, and this one holds none (docs/web.md, "Updating").
  capture-spool:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SCORSESE_DATA}/cache/captures
